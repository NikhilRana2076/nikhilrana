# Keeps data/fpl-history.json in sync with Nikhil's FPL team (entry 2290455).
# Runs every 6 hours; the website reads this file, so the FPL charts update themselves.
name: Update FPL data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest FPL history
        run: |
          set -e
          curl -sSf --retry 3 -A "Mozilla/5.0 (portfolio FPL updater)" \
            "https://fantasy.premierleague.com/api/entry/2290455/history/" -o /tmp/fpl.json
          # Only accept a valid response that contains gameweek data
          python3 -c "import json;d=json.load(open('/tmp/fpl.json'));assert 'current' in d and 'past' in d"
          mkdir -p data
          python3 -c "import json;json.dump(json.load(open('/tmp/fpl.json')),open('data/fpl-history.json','w'),indent=1)"

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/fpl-history.json; then
            echo "No change in FPL data."
          else
            git config user.name "fpl-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fpl-history.json
            git commit -m "Update FPL data"
            git push
          fi
